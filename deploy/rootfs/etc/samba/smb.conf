# clawbook-lehre: one share, the home directory of "student".
[global]
   server role = standalone server
   workgroup = WORKGROUP
   map to guest = never
   server min protocol = SMB2_10
   smb ports = 445
   disable netbios = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1

[student]
   path = /home/student
   valid users = student
   read only = no
   browseable = yes
   create mask = 0644
   directory mask = 0755
