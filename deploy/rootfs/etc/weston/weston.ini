[core]
backend=rdp
renderer=pixman
require-input=false
idle-time=0
xwayland=true

[rdp]
refresh-rate=60
tls-cert=/home/student/.clawbook/rdp/tls.crt
tls-key=/home/student/.clawbook/rdp/tls.key

[shell]
panel-position=top
background-color=0xff2d2d2d
locking=false

[output]
name=rdp
mode=1920x1080

[launcher]
icon=/usr/share/icons/hicolor/24x24/apps/chromium.png
path=/usr/local/bin/clawbook-browser

[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/local/bin/clawbook-terminal
