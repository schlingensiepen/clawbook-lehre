# Builds the image, tests it and publishes it to ghcr.io.
#
# Order: lint -> build (load) -> smoke test -> publish. The publish step runs
# only when lint and smoke test are green, so no untested image is pushed.
# Tags are computed by docker/metadata-action: branch name, git tag, full
# commit SHA, and "latest" for the default branch only.

name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Containerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: deploy/Containerfile
      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $files = @('get-clawbook.ps1', 'windows/clawbook.ps1')
          $bad = 0
          foreach ($f in $files) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$t, [ref]$e)
            foreach ($x in $e) { Write-Host "::error file=$f,line=$($x.Extent.StartLineNumber)::$($x.Message)"; $bad++ }
          }
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          foreach ($f in $files) {
            foreach ($r in (Invoke-ScriptAnalyzer -Path $f -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error,Warning)) {
              Write-Host "::error file=$f,line=$($r.Line)::$($r.RuleName): $($r.Message)"; $bad++
            }
          }
          exit $bad
      - name: Lint shell scripts
        run: |
          shellcheck deploy/rootfs/etc/cont-init.d/10-clawbook \
                     deploy/rootfs/etc/services.d/*/run \
                     deploy/rootfs/usr/local/bin/clawbook-* \
                     deploy/check-versions.sh \
                     deploy/smoke-test.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      # The image is several GB; the hosted runner needs room for it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Read pinned versions
        id: versions
        run: |
          {
            echo "args<<EOF"
            grep -v '^#' deploy/versions.env | grep .
            echo "CLAWBOOK_BUILD=${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          load: true
          tags: clawbook-lehre:smoke
          build-args: ${{ steps.versions.outputs.args }}

      - name: Smoke test
        run: |
          sudo apt-get install -y -qq smbclient >/dev/null
          deploy/smoke-test.sh clawbook-lehre:smoke "${GITHUB_SHA}"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=clawbook-lehre
            org.opencontainers.image.description=Arbeitsrechner für die Arbeit mit KI-Agenten

      # Same daemon, same build args: this build comes from the cache and
      # pushes exactly the image that passed the smoke test.
      - name: Publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.versions.outputs.args }}
